<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2a1a5e" />
<title>SKYDRIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --pink:#ff6ba8; --purple:#a06bff; --cyan:#46e6ff; --orange:#ffb86b; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; overflow:hidden; background:#1a1140; }
  body{ font-family:'Poppins', system-ui, -apple-system, sans-serif; color:#fff;
    user-select:none; -webkit-user-select:none; position:fixed; inset:0; }
  #game{ display:block; position:absolute; inset:0; touch-action:none; }

  #hud{ position:absolute; top:0; left:0; right:0; padding:18px 22px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:5; text-shadow:0 2px 12px rgba(0,0,0,.35); }
  #score{ font-weight:800; font-size:46px; line-height:1; letter-spacing:-1px; transform-origin:left center; display:inline-block; }
  #scoreLabel{ font-size:12px; font-weight:600; opacity:.7; letter-spacing:3px; }
  .hrow{ display:flex; align-items:baseline; gap:5px; }
  .unit{ font-size:20px; font-weight:800; opacity:.55; }
  .worldrow{ font-size:11px; font-weight:800; letter-spacing:2px; margin-top:8px; }
  .worldrow #worldName{ color:#fff; opacity:.92; }
  .worldrow #nextWorld{ opacity:.45; margin-left:7px; }
  .prog{ margin-top:6px; width:150px; height:5px; border-radius:99px; background:rgba(255,255,255,.16); overflow:hidden; }
  #progFill{ height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#7af0ff,#46e6ff); transition:width .15s linear; }
  .fuel{ margin-top:12px; width:150px; height:14px; border-radius:99px;
    background:rgba(255,255,255,.16); overflow:hidden; border:1px solid rgba(255,255,255,.28); }
  #fuelFill{ height:100%; width:100%; border-radius:99px;
    background:linear-gradient(90deg,#18bfe0,#7af0ff); }
  .fuelLabel{ font-size:10px; font-weight:700; letter-spacing:2px; opacity:.7; margin-top:4px; }
  .combo{ font-weight:800; font-size:30px; color:#ffd23c; text-shadow:0 0 18px rgba(255,210,60,.85);
    letter-spacing:-0.5px; }
  .jamwarn{ position:absolute; top:84px; left:0; right:0; text-align:center; font-weight:800;
    font-size:17px; color:#ff6ba8; text-shadow:0 0 14px rgba(255,90,140,.85); }
  .orbs{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:24px;
    background:rgba(255,255,255,.12); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    padding:8px 16px; border-radius:99px; border:1px solid rgba(255,255,255,.18); }
  .orbs .dot{ width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--cyan) 60%, #1198c9);
    box-shadow:0 0 12px var(--cyan); }

  .overlay{ position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; padding:32px; text-align:center;
    background:radial-gradient(120% 90% at 50% 0%, rgba(160,107,255,.18), rgba(26,17,64,.55) 70%);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .hidden{ display:none !important; }
  .logo{ font-weight:800; font-size:64px; line-height:.9; letter-spacing:-2px;
    background:linear-gradient(120deg, var(--cyan), var(--pink) 55%, var(--orange));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 30px rgba(255,107,168,.45)); }
  .tag{ font-size:14px; font-weight:600; opacity:.75; letter-spacing:1px; margin-top:-6px; }
  .btn{ pointer-events:auto; cursor:pointer; border:none; color:#1a1140; font-family:inherit;
    font-weight:800; font-size:22px; letter-spacing:.5px; padding:18px 54px; border-radius:99px;
    background:linear-gradient(120deg, #7af0ff, var(--cyan) 40%, #18bfe0);
    box-shadow:0 10px 30px rgba(70,230,255,.45), inset 0 1px 0 rgba(255,255,255,.6);
    transition:transform .12s ease, box-shadow .12s ease; }
  .btn:active{ transform:scale(.95); box-shadow:0 4px 14px rgba(70,230,255,.4); }
  .btn.pink{ background:linear-gradient(120deg,#ff9ec7,var(--pink) 45%,#e84d8c);
    box-shadow:0 10px 30px rgba(255,107,168,.45), inset 0 1px 0 rgba(255,255,255,.5); }
  .hint{ font-size:14px; opacity:.7; font-weight:500; margin-top:4px; max-width:280px; }
  .field{ width:min(300px,80vw); font-family:inherit; font-weight:700; font-size:18px; color:#fff;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); border-radius:14px;
    padding:15px 18px; outline:none; text-align:center; }
  .field::placeholder{ color:rgba(255,255,255,.45); letter-spacing:1px; }
  .errline{ font-size:13px; font-weight:700; color:#ff8aa8; min-height:16px; }
  .menurow{ display:flex; gap:12px; }
  .btn2{ pointer-events:auto; cursor:pointer; border:none; font-family:inherit; font-weight:800;
    font-size:15px; letter-spacing:.5px; color:#fff; padding:13px 22px; border-radius:99px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
    transition:transform .1s; }
  .btn2:active{ transform:scale(.94); }
  .best{ font-size:15px; font-weight:700; opacity:.85; }
  .best b{ color:var(--cyan); }

  .card{ width:min(380px, 92vw); background:rgba(38,26,86,.6); backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.14);
    border-radius:28px; padding:26px 24px; display:flex; flex-direction:column; gap:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.45); }
  .gostat{ display:flex; justify-content:space-around; }
  .gostat .v{ font-size:40px; font-weight:800; line-height:1; }
  .gostat .l{ font-size:11px; font-weight:600; opacity:.65; letter-spacing:2px; }
  .newbest{ align-self:center; font-size:12px; font-weight:800; letter-spacing:2px;
    padding:6px 16px; border-radius:99px; color:#1a1140;
    background:linear-gradient(120deg,var(--orange),var(--pink)); box-shadow:0 6px 20px rgba(255,184,107,.5); }
  .lbtitle{ font-size:12px; font-weight:700; letter-spacing:3px; opacity:.6; text-align:left; }
  #dresser,#fxRow{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .tile{ width:62px; height:62px; border-radius:16px; background:rgba(255,255,255,.07);
    border:2px solid rgba(255,255,255,.12); cursor:pointer; pointer-events:auto;
    display:flex; align-items:center; justify-content:center; transition:transform .1s; }
  .tile:active{ transform:scale(.92); }
  .tile.sel{ border-color:var(--cyan); box-shadow:0 0 16px rgba(70,230,255,.55); background:rgba(70,230,255,.12); }
  .tile canvas{ width:52px; height:52px; pointer-events:none; }
  .charname{ font-size:13px; font-weight:800; color:var(--cyan); margin-top:-6px; letter-spacing:1px; }
  .lbrow{ display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px;
    padding:8px 12px; border-radius:12px; background:rgba(255,255,255,.05); }
  .lbrow.me{ background:rgba(70,230,255,.16); border:1px solid rgba(70,230,255,.35); }
  .lbrow .rank{ font-weight:800; opacity:.55; width:26px; }
  .lbrow .nm{ flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lbrow .sc{ font-weight:800; color:var(--cyan); }
  .namewrap{ display:flex; gap:8px; }
  .namewrap input{ flex:1; font-family:inherit; font-weight:700; font-size:18px; color:#fff;
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    border-radius:14px; padding:12px 16px; outline:none; text-align:center; }
  .namewrap input::placeholder{ color:rgba(255,255,255,.4); }
  .save{ pointer-events:auto; cursor:pointer; border:none; font-family:inherit; font-weight:800;
    color:#1a1140; padding:0 20px; border-radius:14px; background:linear-gradient(120deg,#7af0ff,var(--cyan)); }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hudTop">
      <div id="scoreLabel">HEIGHT</div>
      <div class="hrow"><span id="score">0</span><span class="unit">m</span></div>
      <div class="worldrow"><span id="worldName">SUNSET</span><span id="nextWorld"></span></div>
      <div class="prog"><div id="progFill"></div></div>
    </div>
    <div id="combo" class="combo hidden"></div>
    <div id="jamWarn" class="jamwarn hidden"></div>
  </div>

  <!-- LOGIN / create account (first open) -->
  <div id="login" class="overlay hidden">
    <div class="logo">SKYDRIFT</div>
    <div class="tag">create your account</div>
    <input id="accName" class="field" maxlength="12" placeholder="NAME" autocomplete="off" />
    <input id="accEmail" class="field" type="email" placeholder="EMAIL" autocomplete="off" />
    <button class="btn" id="createBtn">CREATE ACCOUNT</button>
    <div id="loginErr" class="errline"></div>
  </div>

  <!-- MAIN MENU -->
  <div id="menu" class="overlay hidden">
    <div class="logo">SKYDRIFT</div>
    <div class="tag">JUMP · BOUNCE · CLIMB</div>
    <button class="btn" id="playBtn">PLAY</button>
    <div class="menurow">
      <button class="btn2" id="shopBtn">🛍 SHOP</button>
      <button class="btn2" id="lbBtn">🏆 RANKS</button>
    </div>
    <div class="best">Best: <b id="bestScore">0</b></div>
    <div id="hello" class="hint"></div>
  </div>

  <!-- SHOP (wardrobe) -->
  <div id="shop" class="overlay hidden">
    <div class="card">
      <div class="lbtitle">CHARACTER</div>
      <div id="dresser"></div>
      <div id="charName" class="charname"></div>
      <div class="lbtitle">JUMP TRAIL</div>
      <div id="fxRow"></div>
      <div id="fxName" class="charname"></div>
      <button class="btn pink" id="shopBack">BACK</button>
    </div>
  </div>

  <!-- LEADERBOARD -->
  <div id="lbScreen" class="overlay hidden">
    <div class="card">
      <div class="lbtitle">LEADERBOARD</div>
      <div id="board"></div>
      <button class="btn pink" id="lbBack">BACK</button>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="over" class="overlay hidden">
    <div class="card">
      <div id="newBest" class="newbest hidden">NEW BEST!</div>
      <div class="gostat">
        <div><div class="v" id="finalScore">0</div><div class="l">HEIGHT REACHED</div></div>
      </div>
      <div id="savedNote" class="hint">score saved ✓</div>
      <button class="btn" id="againBtn">PLAY AGAIN</button>
      <button class="btn2" id="overMenu">MENU</button>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  let G_sky, G_veil, G_glass, G_sun, G_vig;   // cached gradients (rebuilt only on resize)

  // ----- World constants -----
  const Z_ROBOT = 7;     // robot further from camera -> smaller on screen
  const Z_FAR   = 95;
  const Z_NEAR  = 0.9;
  const TRACK_W = 2.2;   // half-width of the glass walkway
  const PLATFORM_END = 90;   // glass lane extends most of the way to the horizon (depth)
  const R_PAD   = 0.42;
  const ROBOT_SY = 0.70; // robot sits lower on screen -> camera looks DOWN at it
  const CEIL = 3.8;      // cloud-ceiling altitude (top of the play zone)
  // ---- Characters (wardrobe). Each has colours + its own jump "draft" colours ----
  const CHARACTERS = [
    { id:'ghost',  name:'Wisp'   },
    { id:'jelly',  name:'Méduse' },
    { id:'robot',  name:'Robo'   },
    { id:'slime',  name:'Gloo'   },
    { id:'dragon', name:'Drake'  },
    { id:'phoenix',name:'Blaze'  },
    { id:'bat',    name:'Echo'   },
    { id:'octo',   name:'Inky'   },
    { id:'fox',    name:'Kit'    },
    { id:'axo',    name:'Axo'    },
    { id:'cyclo',  name:'Gorp'   },
    { id:'bee',    name:'Buzz'   },
    { id:'owl',    name:'Hoot'   },
  ];
  // jump "trail" effects — chosen independently from the character
  const EFFECTS = [
    { id:'bubble',  name:'Bubbles', kind:'bubble', colors:['#dffaff','#bfeaff'] },
    { id:'fire',    name:'Fire',    kind:'solid',  colors:['#ffe06a','#ff8a3c','#ff5236'] },
    { id:'ice',     name:'Ice',     kind:'solid',  colors:['#eaffff','#bdf0ff','#7fd6f5'] },
    { id:'rainbow', name:'Rainbow', kind:'bubble', colors:['#ff6ba8','#ffd23c','#7af0ff','#a06bff'] },
    { id:'plasma',  name:'Plasma',  kind:'solid',  colors:['#9fffba','#7af0ff','#c08bff'] },
  ];
  let selChar = Math.max(0, Math.min(CHARACTERS.length-1, parseInt(localStorage.getItem('skydrift_char')||'0',10)||0));
  let selFx   = Math.max(0, Math.min(EFFECTS.length-1,   parseInt(localStorage.getItem('skydrift_fx')||'0',10)||0));

  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 3); // full crisp resolution
    W = window.innerWidth; H = window.innerHeight;
    canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    initStars(); buildGradients();
  }
  function buildGradients(){
    const HOR=horizon();
    G_sky=ctx.createLinearGradient(0,0,0,H);
    G_sky.addColorStop(0,'#1f1450'); G_sky.addColorStop(0.4,'#6b3a86'); G_sky.addColorStop(0.62,'#d96b8e'); G_sky.addColorStop(1,'#ffb86b');
    G_veil=ctx.createLinearGradient(0,HOR,0,H);
    G_veil.addColorStop(0,'rgba(18,10,42,0)'); G_veil.addColorStop(1,'rgba(14,8,38,0.5)');
    G_glass=ctx.createLinearGradient(0,HOR,0,H);
    G_glass.addColorStop(0,'rgba(140,225,255,0.04)'); G_glass.addColorStop(1,'rgba(160,235,255,0.20)');
    const cx=W*0.5, cy=HOR*0.96, R=Math.min(W,H)*0.34;
    G_sun=ctx.createRadialGradient(cx,cy,0,cx,cy,R);
    G_sun.addColorStop(0,'rgba(255,236,180,.9)'); G_sun.addColorStop(0.35,'rgba(255,170,120,.5)'); G_sun.addColorStop(1,'rgba(255,150,120,0)');
    G_vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.75);
    G_vig.addColorStop(0,'rgba(0,0,0,0)'); G_vig.addColorStop(1,'rgba(20,8,40,.45)');
  }
  window.addEventListener('resize', resize);

  // ----- Perspective with a camera that follows the robot's altitude -----
  function focal(){ return H*1.05; }
  function horizon(){ return H*0.34; }
  // camera follows the robot's altitude -> climbing scrolls the world down past you
  function camHeight(){ return ry + (ROBOT_SY - 0.34) * Z_ROBOT / 1.05; }
  function project(wx, wy, z){
    const s = focal()/z, ch = camHeight();
    return { x: W/2 + wx*s, y: horizon() + (ch - wy)*s, s };
  }

  // ----- State -----
  const ST = { MENU:0, PLAY:1, DEAD:2 };
  let state = ST.MENU;
  let ry, vy, jumpsLeft, jumpFlash, maxRy, distance, worldSpeed, distSinceObs, nextGap, cloudY, leftGround;
  let combo, bonus, tapBuffer, lastType, pendingBig, downdraft, ddCool, jammed, skyTier, bannerText, bannerT, hudP, hudLast;
  let clouds, particles, pops, stars, motes;
  let shake, deathTimer;
  let DEBUG_BOT=false, FORCE=null, BG=0, START_H=0;   // dev-only helpers (BG = background style; START_H = warp-start height)

  const LS_BOARD='skydrift_board_v4', LS_ACCT='skydrift_acct_v1';
  let account=null;
  function loadBoard(){ try{return JSON.parse(localStorage.getItem(LS_BOARD))||[];}catch(e){return[];} }
  function saveBoard(b){ try{localStorage.setItem(LS_BOARD,JSON.stringify(b));}catch(e){} }
  function bestScore(){ const b=loadBoard(); return b.length?b[0].score:0; }
  function loadAccount(){ try{return JSON.parse(localStorage.getItem(LS_ACCT))||null;}catch(e){return null;} }
  function saveAccount(a){ try{localStorage.setItem(LS_ACCT,JSON.stringify(a));}catch(e){} }
  const OVERLAYS=['login','menu','shop','lbScreen','over'];
  function show(id){ for(const o of OVERLAYS){ const el=document.getElementById(o); if(el) el.classList.toggle('hidden', o!==id); }
    document.getElementById('hud').classList.add('hidden'); }
  function refreshMenu(){ document.getElementById('bestScore').textContent=bestScore();
    document.getElementById('hello').textContent = account ? ('Hi, '+account.name+' 👋') : ''; }
  function goMenu(){ reset(); state=ST.MENU; refreshMenu(); show('menu'); }

  function initStars(){
    stars=[]; const n=Math.floor((W*H)/22000);
    for(let i=0;i<n;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+0.4,ph:Math.random()*6.28});
  }
  function initMotes(){   // faint DISTANT background clouds — parallax depth, fills the empty sky
    motes=[]; for(let i=0;i<7;i++) motes.push({x:Math.random()*W, y:Math.random()*(H+260), r:55+Math.random()*95});
  }
  function reset(){
    ry=0; vy=0; jumpsLeft=2; jumpFlash=0; maxRy=0; distance=0;
    worldSpeed=16; distSinceObs=0; nextGap=15; cloudY=1.0; leftGround=false;
    combo=0; bonus=0; tapBuffer=0; lastType='normal'; pendingBig=0; downdraft=0; ddCool=5; jammed=0; skyTier=0; bannerText=''; bannerT=0; hudP=0; hudLast=0;
    clouds=[]; particles=[]; pops=[]; initMotes();
    shake=0; deathTimer=0;
    // dev warp-start: begin already at START_H height so the world transition is quick to reach
    const off = START_H>0 ? START_H/10 : 0;
    ry=off; maxRy=off; cloudY=1.0+off;
    // a gentle ascending ladder of REAL clouds (gap only BETWEEN them -> no stray big space)
    for(let i=0;i<6;i++){ clouds.push({ z:25+i*14, wy:cloudY, used:false, missed:false, puff:0, type:'normal', cscale:0.85+Math.random()*0.32 }); if(i<5) cloudY+=1.2+Math.random()*0.9; }
  }

  // ----- Spawning: varied gaps incl. BIG (double-jump) gaps; FAKES only where jumps are banked -----
  function spawnEvent(){
    const H = maxRy*10;
    const g = Math.min(1, H/1800);                                      // gap width widens slowly, caps at height 1800
    const fakeChance  = Math.max(0, Math.min(0.42, (H-80)/520*0.42));   // fakes ease in from height 80
    const boostChance = Math.max(0, Math.min(0.25, (H-200)/800*0.50));  // boosts ease in from height 200 (rarer now)
    let gap, type='normal';
    if(pendingBig>0){
      gap = pendingBig; pendingBig = 0;              // the BIG void after a boost cloud
    } else if(lastType==='fake'){
      gap = 1.8 + Math.random()*0.6;                 // recovery cloud after a fake (reachable with a jump)
    } else if(lastType!=='boost' && Math.random()<fakeChance){
      type='fake'; gap = 1.0 + Math.random()*0.5;    // small gap INTO a fake (coast in, jumps banked)
    } else if(Math.random()<boostChance){
      type='boost'; gap = 1.6 + Math.random()*0.6;
      pendingBig = 3.0 + g*1.4 + Math.random()*0.3;  // void 3.0 -> ~4.7 (boost won't overshoot it), then caps
    } else {
      gap = 2.6 + g*0.5 + Math.random()*0.2;         // normal gap 2.6 -> ~3.3: needs a double-jump, with margin
      if(H>4000 && Math.random()<0.16) type='crumble';        // MILESTONE 4k: crumbling clouds
      else if(H>3000 && Math.random()<0.13) type='jam';       // MILESTONE 3k: jammer clouds
      if(FORCE==='jam'||FORCE==='crumble') type=FORCE;        // dev
    }
    cloudY += gap;
    // MILESTONE 1: drifting clouds — normal clouds start bobbing from height 1200 (more common higher up)
    const drift = (type==='normal') && H>1200 && Math.random() < Math.min(0.55, (H-1200)/2200);
    const damp  = drift ? (0.3 + Math.min(0.25,(H-1200)/6000)) : 0;
    clouds.push({ z:Z_FAR, wy:cloudY, baseWy:cloudY, drift, dphase:Math.random()*6.28, damp, used:false, missed:false, puff:0, type, cscale:0.85+Math.random()*0.32 });
    lastType = type;
  }

  // ----- Input: tap = jump to reach clouds; tapping AS you land = a PERFECT bounce -----
  function onTap(){
    if(state!==ST.PLAY) return;
    tapBuffer=0.18;   // remember the tap briefly — if you land on a cloud now, it's a PERFECT
    let onCloud=false;
    for(const c of clouds){ if(!c.used && Math.abs(c.z-Z_ROBOT)<1.4 && Math.abs(ry-c.wy)<0.95){ onCloud=true; break; } }
    if(!onCloud && jumpsLeft>0){ vy=5.5; jumpsLeft--; jumpFlash=0.25; for(let i=0;i<7;i++) thrustParticle(); }
  }
  canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); onTap(); });
  window.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); if(state===ST.MENU) startGame(); else onTap(); } });

  // ----- Flow -----
  function startGame(){
    reset(); state=ST.PLAY;
    for(const o of OVERLAYS) document.getElementById(o).classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
  }
  function scoreNow(){ return Math.floor(maxRy*10)+bonus; }   // height + combo bonus
  function die(){
    if(state!==ST.PLAY) return;
    state=ST.DEAD; shake=26; deathTimer=0;
    const p=project(0,ry,Z_ROBOT); burst(p.x,p.y,'#46e6ff',26); burst(p.x,p.y,'#ff6ba8',18);
  }

  function finishToGameOver(){
    const sc=scoreNow();
    const prevBest=bestScore(), isBest=sc>prevBest;
    const board=loadBoard();
    board.push({name:(account&&account.name)||'YOU', score:sc});   // AUTO-SAVE under your account
    board.sort((a,b)=>b.score-a.score); saveBoard(board.slice(0,20));
    document.getElementById('finalScore').textContent=sc;
    document.getElementById('newBest').classList.toggle('hidden',!isBest);
    show('over');
  }
  function renderBoard(){
    const el=document.getElementById('board'); const board=loadBoard().slice(0,10);
    const me=(account&&account.name)||'';
    if(!board.length){ el.innerHTML='<div class="lbrow"><span class="nm" style="opacity:.5">No scores yet — play a game!</span></div>'; return; }
    el.innerHTML=board.map((e,i)=>`<div class="lbrow ${e.name===me?'me':''}"><span class="rank">${i+1}</span><span class="nm">${esc(e.name)}</span><span class="sc">${e.score}</span></div>`).join('');
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function drawEffectPreview(g, fx, S){
    const pts=[[-0.55,0.25],[0,-0.15],[0.55,0.3],[-0.3,-0.45],[0.3,-0.05],[0,0.55]];
    pts.forEach((pt,i)=>{ const x=pt[0]*S*1.4, y=pt[1]*S*1.4, r=S*0.18+(i%2)*S*0.06, col=fx.colors[i%fx.colors.length];
      if(fx.kind==='bubble'){ g.globalAlpha=0.9; g.fillStyle='rgba(255,255,255,0.15)'; g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill();
        g.strokeStyle=col; g.lineWidth=Math.max(1.5,r*0.22); g.stroke();
        g.fillStyle='rgba(255,255,255,0.8)'; g.beginPath(); g.arc(x-r*0.3,y-r*0.3,r*0.25,0,6.2832); g.fill(); g.globalAlpha=1; }
      else { g.fillStyle=col; g.shadowColor=col; g.shadowBlur=6; g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill(); g.shadowBlur=0; }
    });
  }
  function buildTiles(containerId, items, selIdx, drawFn, nameId, onPick){
    const el=document.getElementById(containerId); if(!el) return; el.innerHTML='';
    items.forEach((it,i)=>{
      const t=document.createElement('div'); t.className='tile'+(i===selIdx?' sel':''); t.title=it.name;
      const cv=document.createElement('canvas'); cv.width=104; cv.height=104; t.appendChild(cv);
      const g=cv.getContext('2d'); g.translate(52,52); drawFn(g,it,30);
      const pick=(e)=>{ if(e){ e.preventDefault(); e.stopPropagation(); } onPick(i); buildDresser(); };
      t.addEventListener('pointerdown', pick); t.addEventListener('click', pick);
      el.appendChild(t);
    });
    const nm=document.getElementById(nameId); if(nm) nm.textContent=items[selIdx].name;
  }
  function buildDresser(){

      i=>{ selChar=i; try{localStorage.setItem('skydrift_char',String(i));}catch(_){} });
    buildTiles('fxRow', EFFECTS, selFx, drawEffectPreview, 'fxName',

  function bindBtn(id, fn){ const b=document.getElementById(id); const h=e=>{ e.preventDefault(); fn(); };
    b.addEventListener('click',h); b.addEventListener('pointerup',h); }   // click + touch (reliable on phone)
  function createAccount(){

  bindBtn('lbBack', goMenu);
  bindBtn('overMenu', goMenu);

  // ----- Particles -----
  function burst(x,y,color,n){
    for(let i=0;i<n;i++){ const a=Math.random()*6.28, sp=60+Math.random()*260;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:0.5+Math.random()*0.5,size:2+Math.random()*4,color}); }
  }
  function thrustParticle(){   // the jump "draft" — style chosen in the wardrobe
    const fx=EFFECTS[selFx]; const big=fx.kind==='bubble';
    const p=project((Math.random()-0.5)*0.5, ry-0.05, Z_ROBOT);
    particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*70,vy:80+Math.random()*110,life:0,max:big?0.65:0.45,
      size:(big?7:3)+Math.random()*(big?7:4),
      color:fx.colors[Math.floor(Math.random()*fx.colors.length)], kind:fx.kind});
  }
  function addPop(x,y,t){ pops.push({x,y,vy:-50,life:0,max:0.8,text:t}); }

  // ----- Update -----
  function update(dt){
    if(state===ST.DEAD){ deathTimer+=dt; shake*=Math.pow(0.001,dt); updateParticles(dt);
      if(deathTimer>0.9) finishToGameOver(); return; }
    if(state!==ST.PLAY){ updateParticles(dt); return; }

    if(jumpFlash>0) jumpFlash-=dt;
    if(tapBuffer>0) tapBuffer-=dt;
    if(DEBUG_BOT){
      let near=null, bd=999;
      for(const c of clouds){ if(c.used) continue; const dz=c.z-Z_ROBOT; if(dz>-0.8 && dz<bd){ bd=dz; near=c; } }
      if(near){
        if(near.z-Z_ROBOT<1.0 && Math.abs(ry-near.wy)<0.7) onTap();
        else if(near.wy-ry>0.3 && vy<2 && jumpsLeft>0) onTap();
      }
    }
    const H = maxRy*10;                  // height = score
    const spd = Math.min(1, H/1500);     // speed ramps SLOWLY over a long climb, caps at height 1500
    worldSpeed = 13 + spd*7;             // 13 -> 20 only (much calmer — was 14->26)
    distance+=worldSpeed*dt;

    // MILESTONE timers: jam (3k) wears off; downdrafts (2k) surge periodically
    if(jammed>0) jammed-=dt;
    if(downdraft>0) downdraft-=dt;
    if(H>2000){ ddCool-=dt; if(ddCool<=0 && downdraft<=0){ downdraft=1.3; ddCool=6+Math.random()*5; } }

    // jump physics — downdraft surges gravity; jam caps you at a single jump
    const grav=12*(downdraft>0?1.85:1);
    vy-=grav*dt;
    vy=Math.max(-16, Math.min(13, vy));
    ry+=vy*dt;
    if(ry>1.0) leftGround=true;
    if(ry<=0){ ry=0; if(vy<0) vy=0; jumpsLeft=(jammed>0?1:2);
      if(leftGround){ die(); return; } }            // fell back to the ground -> game over
    if(ry>maxRy) maxRy=ry;
    const tier=Math.min(SKY_NAMES.length-1, Math.floor(maxRy*10/1000));   // new world every 1000 height
    if(tier>skyTier){ skyTier=tier; bannerText='✦ '+SKY_NAMES[tier]+' ✦'; bannerT=2.2; }
    if(bannerT>0) bannerT-=dt;

    // spawn the next (higher) cloud on the ladder
    distSinceObs+=worldSpeed*dt;
    if(distSinceObs>=nextGap){ distSinceObs=0; nextGap=8+Math.random()*9; spawnEvent(); }

    for(const c of clouds){ c.z-=worldSpeed*dt; if(c.puff>0) c.puff-=dt;
      if(c.drift) c.wy = c.baseWy + Math.sin(distance*0.5 + c.dphase)*c.damp; }   // drifting clouds bob up/down

    // AUTO-BOUNCE when you genuinely land on a cloud; tapping as you land = PERFECT
    for(const c of clouds){
      // bounce zone is tied to each cloud's drawn size (0.82*cscale radius) so it matches the visual exactly
      if(!c.used && Math.abs(c.z-Z_ROBOT)<1.25 && Math.abs(ry-c.wy) < 0.34+0.5*(c.cscale||1)){
        c.used=true; c.puff=0.4;
        const p=project(0,c.wy,Z_ROBOT);
        const refill = jammed>0?1:2;                 // jam caps refills at a single jump
        if(c.type==='fake'){                         // FAKE: does NOTHING — pass right through it
          combo=0; burst(p.x,p.y,'#cfc6ee',12); addPop(p.x,p.y,'FAKE!');
        } else if(c.type==='jam'){                   // JAMMER: disables your double-jump for 5s
          jumpsLeft=1; jammed=5; combo=0; vy=6.5; shake=10; burst(p.x,p.y,'#ff5a8a',16); addPop(p.x,p.y,'JAMMED!');
        } else if(c.type==='crumble'){               // CRUMBLE: shatters, weak bounce -> must jump off fast
          jumpsLeft=refill; combo=0; vy=5.5; burst(p.x,p.y,'#d8c8b0',16); addPop(p.x,p.y,'CRUMBLE');
        } else if(c.type==='boost'){                 // BOOST: strong launch to clear the void
          jumpsLeft=refill; combo++; bonus+=combo*5; vy=10.5; burst(p.x,p.y,'#7af0ff',18); addPop(p.x,p.y,'BOOST!');
        } else {
          jumpsLeft=refill;                          // normal real cloud
          if(tapBuffer>0){ combo++; bonus+=combo*5; vy=8.5+Math.min(combo,12)*0.25; tapBuffer=0;
            addPop(p.x,p.y,'PERFECT ×'+combo); burst(p.x,p.y,'#ffd23c',16); }
          else { combo=0; vy=6.5; burst(p.x,p.y,'#ffffff',8); }
        }
      }
    }

    // a cloud you never reached slips past -> the combo shatters (and you're probably falling)
    for(const c of clouds){
      if(!c.used && !c.missed && c.z < Z_ROBOT-1.5){ c.missed=true; if(combo>0) combo=0; }
    }

    clouds=clouds.filter(c=>(c.z>Z_NEAR && !c.used)||c.puff>0);
    updateParticles(dt);
    const Hgt=maxRy*10;
    const sEl=document.getElementById('score'); sEl.textContent=scoreNow();
    hudP=Math.max(0,hudP-dt*5); if(Math.floor(Hgt/25)>hudLast){ hudLast=Math.floor(Hgt/25); hudP=1; }   // pop as you climb
    sEl.style.transform='scale('+(1+hudP*0.16)+')';
    const htier=Math.min(SKY_NAMES.length-1, Math.floor(Hgt/1000));
    document.getElementById('worldName').textContent=SKY_NAMES[htier];
    document.getElementById('nextWorld').textContent = htier<SKY_NAMES.length-1 ? ('→ '+SKY_NAMES[htier+1]) : '★ MAX';
    document.getElementById('progFill').style.width = (htier<SKY_NAMES.length-1 ? (Hgt%1000)/10 : 100)+'%';
    const cEl=document.getElementById('combo');
    if(combo>=2){ cEl.classList.remove('hidden'); cEl.textContent='COMBO ×'+combo; }
    else cEl.classList.add('hidden');
    const jw=document.getElementById('jamWarn');
    if(jammed>0){ jw.classList.remove('hidden'); jw.textContent='⚡ NO DOUBLE-JUMP '+Math.ceil(jammed)+'s'; }
    else jw.classList.add('hidden');
  }
  function updateParticles(dt){
    for(const p of particles){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.kind==='bubble'){ p.vy+=150*dt; p.x+=Math.sin((p.life+p.size)*10)*0.7; } else p.vy+=400*dt; }   // bubbles linger & wobble
    particles=particles.filter(p=>p.life<p.max);
    for(const p of pops){ p.life+=dt; p.y+=p.vy*dt; }
    pops=pops.filter(p=>p.life<p.max);
  }

  // ----- Render -----
  function draw(){
    let sx=0,sy=0; if(shake>0.2){ sx=(Math.random()-0.5)*shake; sy=(Math.random()-0.5)*shake; }
    ctx.save(); ctx.translate(sx,sy);
    drawSky(); drawStars(); drawSun();
    const sorted=clouds.slice().sort((a,b)=>b.z-a.z);   // far clouds first
    for(const c of sorted) drawCloud(c);
    if(state!==ST.DEAD || deathTimer<0.4) drawRobot();
    drawParticles(); drawPops(); drawDowndraft(); drawVignette(); drawBanner();
    ctx.restore();
  }
  function drawBanner(){
    if(bannerT<=0) return;
    ctx.save(); ctx.globalAlpha=Math.min(1,bannerT/0.6); ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font=`800 ${Math.round(H*0.05)}px Poppins,sans-serif`;
    ctx.shadowColor='rgba(255,255,255,0.6)'; ctx.shadowBlur=18;
    ctx.fillText(bannerText, W/2, H*0.34);
    ctx.restore();
  }

  // ---- worlds you climb through (sky morphs every ~1000 height) ----
  const SKIES=[
    {a:[31,20,80],  b:[150,70,120], c:[255,165,110]},   // SUNSET
    {a:[22,18,62],  b:[80,52,120],  c:[210,110,140]},   // DUSK
    {a:[10,12,38],  b:[30,34,80],   c:[70,60,115]},     // NIGHT
    {a:[6,22,32],   b:[22,82,92],   c:[70,155,125]},    // AURORA
    {a:[2,3,14],    b:[12,14,46],   c:[38,28,80]},      // SPACE
  ];
  const SKY_NAMES=['DREAM DUNES','CRYSTAL HAZE','CLOUD TEMPLE','AURORA DREAM','COSMIC DREAM'];
  function lc(x,y,t){ return [Math.round(x[0]+(y[0]-x[0])*t),Math.round(x[1]+(y[1]-x[1])*t),Math.round(x[2]+(y[2]-x[2])*t)]; }
  function rgbs(c){ return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }
  // ---- photographic world background (loaded image) ----
  const PHOTO =new Image(); let photoOk =false; PHOTO.onload =()=>photoOk =true; PHOTO.src ='world1.jpg';   // world 1 — Dream Dunes
  const PHOTO2=new Image(); let photo2Ok=false; PHOTO2.onload=()=>photo2Ok=true; PHOTO2.src='world2.jpg';   // world 2 — Floating Isles
  function drawPhotoBg(img, h0, g){                  // h0 = height where this photo starts panning; g = target ctx
    g=g||ctx;
    const iw=img.naturalWidth, ih=img.naturalHeight; if(!iw||!ih) return;
    const scale=Math.max(W/iw, H/ih)*1.25;           // cover + 25% zoom for vertical pan room
    const dw=iw*scale, dh=ih*scale, dx=(W-dw)/2, pan=dh-H;
    const f=Math.min(1,Math.max(0,((maxRy*10)-(h0||0))/900));   // pans bottom -> top across its own world band
    g.drawImage(img, dx, -pan*(1-f), dw, dh);
  }
  let _off=null,_offCtx=null;                        // offscreen buffer for the feathered world seam
  function offCtx(){
    if(!_off || _off.width!==canvas.width || _off.height!==canvas.height){
      _off=document.createElement('canvas'); _off.width=canvas.width; _off.height=canvas.height; _offCtx=_off.getContext('2d');
    }
    return _offCtx;
  }
  // Stack two worlds vertically: lower (panned to its sky) under, upper sliding down from the top,
  // blended across a soft seam so the top of world A merges into the bottom of world B.
  function drawWorldSeam(lower, lowerH0, upper, upperH0, seamY, feather){
    drawPhotoBg(lower, lowerH0);                     // world below = opaque base
    const o=offCtx(); o.setTransform(DPR,0,0,DPR,0,0); o.clearRect(0,0,W,H);
    drawPhotoBg(upper, upperH0, o);                  // world above, into the buffer
    o.globalCompositeOperation='destination-out';    // feather its bottom edge away
    const grad=o.createLinearGradient(0,seamY-feather,0,seamY);
    grad.addColorStop(0,'rgba(0,0,0,0)'); grad.addColorStop(1,'rgba(0,0,0,1)');
    o.fillStyle=grad; o.fillRect(0,seamY-feather,W,H-(seamY-feather)+2);
    o.globalCompositeOperation='source-over';
    ctx.drawImage(_off,0,0,W,H);                      // composite the feathered upper world over the lower
  }
  function mul(c,f){ return [Math.round(Math.min(255,c[0]*f)),Math.round(Math.min(255,c[1]*f)),Math.round(Math.min(255,c[2]*f))]; }
  function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
  function skyPalette(){
    const hg=maxRy*10, T=1000, n=SKIES.length;
    const i=Math.min(n-1,Math.floor(hg/T)), j=Math.min(n-1,i+1), t=Math.min(1,(hg-i*T)/T);
    return { A:lc(SKIES[i].a,SKIES[j].a,t), B:lc(SKIES[i].b,SKIES[j].b,t), C:lc(SKIES[i].c,SKIES[j].c,t) };
  }
  function drawSky(){
    const P=skyPalette();
    // base procedural sky world (morphs through the palettes as you climb)
    if(BG===1) drawSkyCinematic(P);
    else if(BG===2) drawSkyAurora(P);
    else if(BG===3) drawSkyStrata(P);
    else {
      const g=ctx.createLinearGradient(0,0,0,H);            // BG 0 — flat 3-stop gradient
      g.addColorStop(0,rgbs(P.A)); g.addColorStop(0.6,rgbs(P.B)); g.addColorStop(1,rgbs(P.C));
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
    // photographic worlds layered over the procedural sky, with slow crossfades:
    //   Worlds are STACKED vertically — you climb up out of world 1 into world 2, not a fade.
    //   World 2 slides down from the top; its bottom edge blends into the top of world 1 at a soft seam.
    //     <900: pure world 1.  900..1500: seam descends top->bottom (fully world 2 at 1500).
    //     1500..2000: hold.    2000..2500: world 2 fades out to the procedural worlds.
    const hg=maxRy*10;
    const ramp=(x,a,b)=>Math.min(1,Math.max(0,(x-a)/(b-a)));
    const FEATHER=H*0.16;                                   // thin join — just a bit of overlap (W1 top meets W2 bottom), no ghosting
    if(!photoOk && !photo2Ok){ /* nothing loaded yet */ }
    else if(hg<900 || !photo2Ok){ drawPhotoBg(PHOTO,0); }   // pure world 1
    else if(hg<1500 && photoOk){                            // the climb-through merge
      const prog=(hg-900)/600;                              // 0..1
      const seamY=prog*(H+FEATHER);                         // world-2 bottom edge descends past the screen
      drawWorldSeam(PHOTO,0, PHOTO2,1000, seamY, FEATHER);
    } else {                                                // world 2 (then fades to procedural up high)
      const a2=1-ramp(hg,2000,2500);
      ctx.save(); ctx.globalAlpha=a2; drawPhotoBg(PHOTO2,1000); ctx.restore();
    }
  }
  function drawSkyCinematic({A,B,C}){                       // BG 1 — richer cinematic gradient + horizon bloom
    const top=mul(A,0.5), hi=lc(C,[255,242,214],0.4);
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,rgbs(top)); g.addColorStop(0.34,rgbs(A)); g.addColorStop(0.6,rgbs(B));
    g.addColorStop(0.86,rgbs(C)); g.addColorStop(1,rgbs(hi));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const HOR=horizon();                                    // warm glow blooming up from the horizon
    const gb=ctx.createRadialGradient(W/2,HOR*1.05,0,W/2,HOR*1.05,Math.max(W,H)*0.8);
    gb.addColorStop(0,rgba(hi,0.5)); gb.addColorStop(0.45,rgba(lc(B,C,0.5),0.12)); gb.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gb; ctx.fillRect(0,0,W,H);
  }
  function drawSkyAurora({A,B,C}){                          // BG 2 — deep sky + flowing aurora ribbons
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,rgbs(mul(A,0.45))); g.addColorStop(0.55,rgbs(A)); g.addColorStop(1,rgbs(mul(B,0.85)));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
    const cols=[[90,255,180],[120,150,255],[255,120,200]];
    for(let r=0;r<3;r++){ const baseY=H*(0.16+r*0.15), amp=H*0.045, col=cols[r];
      for(let pass=0;pass<3;pass++){ ctx.strokeStyle=rgba(col,0.05); ctx.lineWidth=H*(0.11-pass*0.034);
        ctx.beginPath();
        for(let x=0;x<=W;x+=16){ const y=baseY+Math.sin(x*0.011+distance*0.12+r*2)*amp+Math.sin(x*0.027+r)*amp*0.5;
          x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
        ctx.stroke();
      } }
    ctx.restore();
  }
  function drawSkyStrata({A,B,C}){                          // BG 3 — soft horizontal light layers scrolling as you climb
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,rgbs(mul(A,0.7))); g.addColorStop(0.6,rgbs(B)); g.addColorStop(1,rgbs(C));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const tint=lc(C,[255,250,240],0.6), step=H*0.5, scroll=((camHeight()*26)%step+step)%step;
    for(let k=-1;k<5;k++){ const y=H-(k*step-scroll);
      const band=ctx.createLinearGradient(0,y-H*0.2,0,y+H*0.04);
      band.addColorStop(0,rgba(tint,0)); band.addColorStop(0.72,rgba(tint,0.11)); band.addColorStop(1,rgba(tint,0));
      ctx.fillStyle=band; ctx.fillRect(0,y-H*0.2,W,H*0.24); }
  }
  function drawStars(){
    if(photoOk) return;                                // photo background supplies its own sky
    const boost=Math.min(1.7, 0.5+(maxRy*10)/1500);   // stars get brighter the higher you climb
    ctx.fillStyle='#fff';
    for(const s of stars){ const x=((s.x-distance*0.02)%W+W)%W;
      const tw=0.5+0.5*Math.sin(s.ph+distance*0.05); ctx.globalAlpha=Math.min(1,(0.2+tw*0.5)*boost)*Math.max(0,1-s.y/(H*0.7));
      ctx.beginPath(); ctx.arc(x,s.y,s.r,0,6.2832); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  function drawSun(){
    if(photoOk) return;                                // photo background supplies its own sun/light
    const cx=W*0.5, cy=horizon()*0.96, R=Math.min(W,H)*0.34;
    ctx.fillStyle=G_sun; ctx.beginPath(); ctx.arc(cx,cy,R,0,6.2832); ctx.fill();
  }
  function drawCloudSea(){   // soft cloud bank along the bottom — "flying above the clouds"
    const topY=H*0.83;
    ctx.save();
    const g=ctx.createLinearGradient(0,topY,0,H);
    g.addColorStop(0,'rgba(248,248,255,0)'); g.addColorStop(1,'rgba(250,250,255,0.5)');
    ctx.fillStyle=g; ctx.fillRect(0,topY,W,H-topY);
    ctx.fillStyle='rgba(252,252,255,0.5)';
    const off=(distance*2.2)%140;
    ctx.beginPath();
    for(let x=-off-160; x<W+180; x+=70){ const r=36+22*Math.abs(Math.sin(x*0.011)); ctx.moveTo(x+r,topY+14); ctx.arc(x,topY+14,r,0,6.2832); }
    ctx.fill();
    ctx.restore();
  }
  function drawCeiling(){
    const cy = horizon() + (camHeight()-CEIL)*(focal()/Z_ROBOT);
    if(cy < -120) return;
    ctx.save();
    ctx.fillStyle='rgba(220,240,255,0.10)'; ctx.fillRect(0,0,W,Math.max(0,cy));
    ctx.fillStyle='rgba(255,255,255,0.16)';
    for(let i=-1;i<Math.ceil(W/110)+1;i++){ const x=i*110+25; const r=58+((i*37)%42);
      ctx.beginPath(); ctx.arc(x, cy, r, 0, 6.2832); ctx.fill(); }
    ctx.restore();
  }
  function drawMountains(){
    const HOR=horizon(), w=W*0.26, off=(distance*0.4)%w;
    ctx.fillStyle='rgba(60,40,100,.5)';
    for(let i=-1;i<Math.ceil(W/w)+2;i++){ const x=i*w-off;
      ctx.beginPath(); ctx.moveTo(x,HOR); ctx.lineTo(x+w*0.5,HOR-H*0.10); ctx.lineTo(x+w,HOR); ctx.closePath(); ctx.fill(); }
  }
  function drawGround(){
    const HOR=horizon();
    // a soft "depth veil" below the horizon -> the open fall on both sides of the path
    ctx.fillStyle=G_veil; ctx.fillRect(0,HOR,W,H-HOR);

    // the glass walkway (a perspective trapezoid down the centre)
    // glass lane at ground level — it recedes as you climb, which gives the sense of rising
    const nL=project(-TRACK_W,0,Z_NEAR), nR=project(TRACK_W,0,Z_NEAR);
    const fL=project(-TRACK_W,0,PLATFORM_END),  fR=project(TRACK_W,0,PLATFORM_END);
    ctx.save();
    ctx.beginPath(); ctx.moveTo(nL.x,nL.y); ctx.lineTo(nR.x,nR.y); ctx.lineTo(fR.x,fR.y); ctx.lineTo(fL.x,fL.y); ctx.closePath();
    ctx.clip();
    ctx.fillStyle=G_glass; ctx.fillRect(0,HOR,W,H);                      // translucent glass pane
    // glass sheen — a soft reflective highlight down the centre
    const sheen=ctx.createLinearGradient(nL.x,0,nR.x,0);
    sheen.addColorStop(0,'rgba(255,255,255,0)'); sheen.addColorStop(0.42,'rgba(255,255,255,0.13)');
    sheen.addColorStop(0.58,'rgba(255,255,255,0.13)'); sheen.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sheen; ctx.fillRect(0,HOR,W,H);
    ctx.restore();
  }

  function drawGlassFloor(){
    const topY=project(0,0,12).y;                 // front "waterline" of the glass — recedes as you climb
    if(topY>=H) return;                            // floor has scrolled off the bottom -> gone
    const fade=Math.max(0,Math.min(1,(H-topY)/(H*0.45)));
    ctx.save(); ctx.globalAlpha=fade;
    const g=ctx.createLinearGradient(0,topY,0,H);  // frosted glass: see-through at the far edge, solid up close
    g.addColorStop(0,'rgba(196,238,255,0.20)'); g.addColorStop(0.5,'rgba(174,224,255,0.52)'); g.addColorStop(1,'rgba(150,212,255,0.72)');
    ctx.fillStyle=g; ctx.fillRect(0,topY,W,H-topY);
    ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillRect(0,topY,W,Math.max(1.5,H*0.004));   // bright leading edge
    ctx.globalAlpha=fade*0.45;                     // diagonal reflective sheen
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=H*0.012; ctx.lineCap='round';
    for(let i=0;i<3;i++){ const x=W*(0.22+i*0.3); ctx.beginPath(); ctx.moveTo(x,topY); ctx.lineTo(x-W*0.12,H); ctx.stroke(); }
    ctx.restore();
  }
  function drawBar(o){
    const tl=project(-TRACK_W,o.hi,o.z), tr=project(TRACK_W,o.hi,o.z);
    const br=project(TRACK_W,o.lo,o.z),  bl=project(-TRACK_W,o.lo,o.z);
    if(tl.s<0.2) return;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(tl.x,tl.y); ctx.lineTo(tr.x,tr.y); ctx.lineTo(br.x,br.y); ctx.lineTo(bl.x,bl.y); ctx.closePath();
    ctx.fillStyle='rgba(255,80,130,0.30)'; ctx.fill();
    ctx.strokeStyle='rgba(255,135,185,0.95)'; ctx.lineWidth=Math.max(2,tl.s*0.05);
    if(tl.s>14){ ctx.shadowColor='rgba(255,90,140,0.85)'; ctx.shadowBlur=12; }
    ctx.stroke();
    ctx.restore();
  }
  function cloudSilhouette(x,y,r){   // wide cartoon cloud: scalloped bottom + dome on top
    ctx.beginPath();
    const L=[[-0.95,0.28,0.34],[-0.60,0.32,0.38],[-0.20,0.34,0.40],[0.20,0.34,0.40],[0.60,0.32,0.38],[0.95,0.28,0.34],
             [-0.50,0.06,0.46],[0,0.06,0.50],[0.50,0.06,0.46],
             [-0.70,-0.12,0.34],[-0.30,-0.28,0.40],[0.15,-0.30,0.40],[0.60,-0.14,0.36],[-0.05,-0.46,0.32]];
    for(let i=0;i<L.length;i++){ const cx=x+L[i][0]*r, cy=y+L[i][1]*r*0.72, rr=L[i][2]*r; ctx.moveTo(cx+rr,cy); ctx.arc(cx,cy,rr,0,6.2832); }
  }
  // bounce objects are COTTON-CANDY CLOUDS — saturated + soft rim, fits the dreamy sky AND pops on the pale pink
  function drawCloud(c){
    const p=project(0,c.wy,c.z); const r=p.s*0.82*(c.cscale||1)*(1+(c.puff>0?Math.sin(c.puff*9)*0.13:0)); if(r<1) return;
    let top='#ffc4de', bot='#a6c2f4', rim='#8aa8ea', flick=1, faint=false;   // cotton-candy pink → soft blue mix
    if(c.type==='fake'){ const near=Math.max(0,Math.min(1,1-(c.z-Z_ROBOT)/24)); flick=near>0.5?(0.62+0.38*Math.sin(distance*1.3)):1; faint=true; top='#eef0f6'; bot='#cbc6d8'; rim='#b3adc2'; }
    else if(c.type==='boost'){ top='#d4fbff'; bot='#3fd0f5'; rim='#1fa6d0'; }
    else if(c.type==='jam'){ top='#ffd0ea'; bot='#ff5aa8'; rim='#d63a86'; }
    else if(c.type==='crumble'){ top='#ece0c8'; bot='#b89a72'; rim='#8c7250'; }
    const alpha=Math.max(0.5,Math.min(1,1-(c.z-18)/72))*flick;
    ctx.save(); ctx.globalAlpha=alpha;
    cloudSilhouette(p.x,p.y,r);                                       // candy body gradient (no outline)
    const bg=ctx.createLinearGradient(0,p.y-r*0.5,0,p.y+r*0.5);
    bg.addColorStop(0,top); bg.addColorStop(1,bot);
    ctx.fillStyle=bg; ctx.fill();
    if(!faint){   // soft white top highlight
      ctx.save(); cloudSilhouette(p.x,p.y,r); ctx.clip();
      ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(p.x-r*0.05,p.y-r*0.22,r*0.62,r*0.22,0,0,6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  function puff(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill(); }
  function drawOrb(o){
    const p=project(0,o.wy,o.z); const r=p.s*0.14*(1+Math.sin(o.ph)*0.12); if(r<0.8) return;
    ctx.save(); if(r>5){ ctx.shadowColor='rgba(70,230,255,.9)'; ctx.shadowBlur=Math.min(10,r); }
    const g=ctx.createRadialGradient(p.x-r*0.3,p.y-r*0.3,0,p.x,p.y,r);
    g.addColorStop(0,'#fff'); g.addColorStop(0.5,'#46e6ff'); g.addColorStop(1,'#1198c9');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.2832); ctx.fill(); ctx.restore();
  }

  function rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  // ---- all characters drawn from BEHIND (back view), no faces ----
  function drawRoboBack(g,S){

    g.beginPath(); g.moveTo( bw*0.85,-bh*0.1); g.lineTo( bw*1.55,bh*0.45); g.lineTo( bw*0.85,bh*0.55); g.closePath(); g.fill();

    for(let i=0;i<3;i++){ const yy=-bh*0.2+i*bh*0.32; g.beginPath(); g.moveTo(-bw*0.32,yy); g.lineTo(bw*0.32,yy); g.stroke(); }
    g.fillStyle='#1c6f8a'; g.beginPath(); g.arc(-bw*0.36,bh*0.88,S*0.13,0,6.2832); g.fill(); g.beginPath(); g.arc(bw*0.36,bh*0.88,S*0.13,0,6.2832); g.fill();
  }
  function drawGhostBack(g,S){

    g.closePath(); g.fill(); g.shadowBlur=0;

  function drawIce(g,S){
    const s=S*0.85;
    g.shadowColor='rgba(150,230,255,0.7)'; g.shadowBlur=S*0.5;
    const grad=g.createLinearGradient(-s,-s,s,s); grad.addColorStop(0,'#eaffff'); grad.addColorStop(0.5,'#bdf0ff'); grad.addColorStop(1,'#7fd6f5');
    g.fillStyle=grad; rr(g,-s,-s,s*2,s*2,s*0.26); g.fill(); g.shadowBlur=0;
    g.fillStyle='rgba(255,255,255,0.45)'; rr(g,-s*0.7,-s*0.75,s*0.8,s*0.5,s*0.14); g.fill();   // gloss
    g.strokeStyle='rgba(255,255,255,0.4)'; g.lineWidth=Math.max(1,S*0.045);                     // facets

  function drawAlien(g,S){
    // --- WINGS (drawn behind the body) — translucent fairy/dragonfly wings ---
    for(const s of [-1,1]){
      g.save(); g.translate(s*S*0.42,-S*0.18); g.rotate(s*0.55);
      const wg=g.createLinearGradient(0,0,s*S*0.9,S*0.4);

      g.beginPath(); g.ellipse(s*S*0.45,-S*0.05,S*0.5,S*0.27,0,0,6.2832); g.fill();   // upper wing
      g.beginPath(); g.ellipse(s*S*0.34,S*0.32,S*0.34,S*0.2,0,0,6.2832); g.fill();    // lower wing
      g.strokeStyle='rgba(255,255,255,0.5)'; g.lineWidth=Math.max(1,S*0.03);          // wing veins
      g.beginPath(); g.moveTo(s*S*0.02,-S*0.02); g.lineTo(s*S*0.9,-S*0.05);
      g.moveTo(s*S*0.05,S*0.05); g.lineTo(s*S*0.62,S*0.18); g.stroke();

      g.beginPath(); g.moveTo(s*S*0.16,-S*0.6); g.quadraticCurveTo(s*S*0.34,-S*1.0,s*S*0.24,-S*1.18); g.stroke();
      g.fillStyle='#ffe05c'; g.shadowColor='#ffe05c'; g.shadowBlur=S*0.3;
      g.beginPath(); g.arc(s*S*0.24,-S*1.2,Math.max(2,S*0.1),0,6.2832); g.fill(); g.shadowBlur=0;

    g.fillStyle=bg; g.beginPath(); g.ellipse(0,0,S*0.62,S*0.74,0,0,6.2832); g.fill(); g.shadowBlur=0;
    // back spine ridge + bumps
    g.strokeStyle='rgba(40,140,95,0.55)'; g.lineWidth=Math.max(1.5,S*0.05);
    g.beginPath(); g.moveTo(0,-S*0.62); g.lineTo(0,S*0.6); g.stroke();
    g.fillStyle='rgba(40,140,95,0.5)';
    for(let i=-1;i<=2;i++){ g.beginPath(); g.arc(0,i*S*0.28,S*0.07,0,6.2832); g.fill(); }
    // spots (detail)

    g.beginPath(); g.arc(-S*0.3,-S*0.25,S*0.08,0,6.2832); g.fill();
    g.beginPath(); g.arc(S*0.32,-S*0.05,S*0.06,0,6.2832); g.fill();
    g.beginPath(); g.arc(-S*0.22,S*0.32,S*0.05,0,6.2832); g.fill();
    // little feet
    g.fillStyle='#2e9468';
    g.beginPath(); g.arc(-S*0.26,S*0.78,S*0.1,0,6.2832); g.fill();
    g.beginPath(); g.arc(S*0.26,S*0.78,S*0.1,0,6.2832); g.fill();
  }
  function drawJelly(g,S){
    // clock + swim pulse. jumpFlash is set to 0.25 on every jump and decays -> one-shot stroke.
    const T = (typeof last==='number'?last:0);
    const jf = (typeof jumpFlash==='number'?jumpFlash:0);
    const flash = Math.max(0, Math.min(1, jf/0.25));         // 1 at the jump instant -> 0
    const pump  = flash*flash;                                // eased power-stroke
    const idle  = Math.sin(T*3.0)*0.5+0.5;                    // slow idle breathing 0..1
    const squeeze = idle*0.12 + pump*0.72;                    // contraction (big on jump)
    const trail   = pump;                                     // tentacles bunch+stream on the stroke
    const bw = S*0.82*(1+squeeze*0.42);                       // bell flattens & widens on contraction
    const bh = S*0.64*(1-squeeze*0.52);

    g.save();
    // --- tentacles (drawn behind the bell) ---
    g.lineCap='round';
    const tcount=7, tlen=S*0.85;
    for(let i=0;i<tcount;i++){
      const tx0 = -bw*0.66 + i*(1.32*bw/(tcount-1));
      const tx  = tx0*(1-trail*0.45);                         // bunch toward centre during the stroke
      const sway = Math.sin(T*4 + i*0.9)*S*0.11*(1-trail*0.85);   // sway calms while streaming
      const tip  = Math.sin(T*4 + i*0.9 + 1.3)*S*0.09*(1-trail*0.7);
      const len  = tlen*(0.8 + (i%2)*0.3)*(1+trail*0.6);      // stream long on the stroke
      g.strokeStyle = i%2 ? 'rgba(255,170,212,0.80)' : 'rgba(255,138,196,0.72)';
      g.lineWidth = Math.max(1.5, S*0.05);
      g.beginPath(); g.moveTo(tx, bh*0.15);
      g.quadraticCurveTo(tx+sway, bh*0.15+len*0.55, tx+tip, bh*0.15+len); g.stroke();
    }
    // frilly oral arms (thicker, central) — also pull together on the stroke
    g.strokeStyle='rgba(255,120,188,0.78)'; g.lineWidth=Math.max(2,S*0.08);
    for(const s of [-1,1]){
      const w=Math.sin(T*3.5+s)*S*0.07*(1-trail*0.7);
      g.beginPath(); g.moveTo(s*bw*0.16, bh*0.05);
      g.bezierCurveTo(s*bw*0.42*(1-trail*0.5)+w, bh*0.45, s*bw*0.08, bh*0.85, s*bw*0.18*(1-trail*0.4)+w, bh*(1.05+trail*0.4)); g.stroke();
    }
    // --- bell (translucent pink cotton-candy dome) ---
    g.shadowColor='rgba(255,150,205,0.55)'; g.shadowBlur=S*0.55;
    const grad=g.createRadialGradient(-bw*0.22,-bh*0.5,S*0.08, 0,0, bw*1.35);
    grad.addColorStop(0,'#fff3fa'); grad.addColorStop(0.45,'#ffc3e2'); grad.addColorStop(1,'#ff8fc6');
    g.fillStyle=grad; g.globalAlpha=0.93;
    g.beginPath(); g.moveTo(-bw,0);
    g.bezierCurveTo(-bw,-bh*1.55, bw,-bh*1.55, bw,0);          // top dome
    const lobes=5;                                            // scalloped jellyfish margin
    for(let i=0;i<lobes;i++){
      const x1 = bw - (i+1)*(2*bw/lobes);
      const mx = bw - (i+0.5)*(2*bw/lobes);
      g.quadraticCurveTo(mx, bh*0.5 + Math.sin(T*4.5+i)*S*0.035, x1, 0);
    }
    g.closePath(); g.fill(); g.shadowBlur=0; g.globalAlpha=1;
    // inner bell ring + glossy highlight
    g.strokeStyle='rgba(255,255,255,0.45)'; g.lineWidth=Math.max(1,S*0.04);
    g.beginPath(); g.arc(0,-bh*0.05,bw*0.58,Math.PI,0); g.stroke();
    g.fillStyle='rgba(255,255,255,0.55)';
    g.beginPath(); g.ellipse(-bw*0.3,-bh*0.55,bw*0.2,bh*0.32,-0.3,0,6.2832); g.fill();
    g.restore();
  }
  // ---- creature characters (each has a face + idle animation; reacts to jumpFlash) ----
  function _clk(){ return (typeof last==='number'?last:0); }
  function _flash(){ const jf=(typeof jumpFlash==='number'?jumpFlash:0); return Math.max(0,Math.min(1,jf/0.25)); }
  function _eyes(g,S,sep,ey,r){                 // cute paired eyes with shine
    for(const x of [-sep,sep]){
      g.fillStyle='#fff'; g.beginPath(); g.arc(x,ey,r,0,6.2832); g.fill();
      g.fillStyle='#2a2440'; g.beginPath(); g.arc(x,ey+r*0.15,r*0.55,0,6.2832); g.fill();
      g.fillStyle='rgba(255,255,255,0.95)'; g.beginPath(); g.arc(x-r*0.25,ey-r*0.25,r*0.24,0,6.2832); g.fill();
    }
  }

  function drawBot(g,S){               // Robo — sleek robot with jetpack burst on jump
    const T=_clk(), flash=_flash();
    g.save();
    if(flash>0.02){                    // jet flames below
      g.fillStyle='#ff8a3c'; g.shadowColor='#ffd23c'; g.shadowBlur=S*0.4;
      for(const s of [-1,1]){ g.beginPath(); g.moveTo(s*S*0.28,S*0.5); g.lineTo(s*S*0.4,S*(0.7+flash*0.7)); g.lineTo(s*S*0.14,S*0.55); g.closePath(); g.fill(); }
      g.shadowBlur=0;
    }
    g.shadowColor='rgba(120,220,255,0.5)'; g.shadowBlur=S*0.4;
    const bg=g.createLinearGradient(0,-S*0.6,0,S*0.6); bg.addColorStop(0,'#eaf6ff'); bg.addColorStop(1,'#9bc4e0');
    g.fillStyle=bg; rr(g,-S*0.42,-S*0.1,S*0.84,S*0.66,S*0.18); g.fill();        // torso
    g.fillStyle='#dfeefc'; rr(g,-S*0.5,-S*0.78,S*1.0,S*0.7,S*0.24); g.fill(); g.shadowBlur=0;   // head
    g.fillStyle='#10243a'; rr(g,-S*0.38,-S*0.66,S*0.76,S*0.42,S*0.16); g.fill();                // visor

  function drawCharacter(g, ch, S){
    g.save();
    if(ch.id==='ghost') drawGhostBack(g,S);
    else if(ch.id==='jelly') drawJelly(g,S);
    else if(ch.id==='slime') drawSlime(g,S);
    else if(ch.id==='dragon') drawDrake(g,S);
    else if(ch.id==='phoenix') drawPhoenix(g,S);
    else if(ch.id==='bat') drawBat(g,S);
    else if(ch.id==='octo') drawOcto(g,S);
    else if(ch.id==='fox') drawFox(g,S);
    else if(ch.id==='axo') drawAxo(g,S);
    else if(ch.id==='cyclo') drawCyclo(g,S);
    else if(ch.id==='bee') drawBee(g,S);
    else if(ch.id==='owl') drawOwl(g,S);
    else drawBot(g,S);   // 'robot' + fallback
    g.restore();
  }

  function drawRobot(){
    const p=project(0,ry,Z_ROBOT); const sz=p.s*0.36;   // character size
    const gp=project(0,0,Z_ROBOT);
    if(gp.y>horizon() && gp.y<H+40){ ctx.save(); ctx.fillStyle='rgba(20,8,40,.28)';
      const altF=Math.min(1,ry/8);
      ctx.beginPath(); ctx.ellipse(gp.x,gp.y,sz*1.4*(1-altF*0.6),sz*0.45*(1-altF*0.6),0,0,6.2832); ctx.fill(); ctx.restore(); }
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.max(-0.18,Math.min(0.18,vy*0.018)));
    const st=Math.max(-0.16,Math.min(0.26, vy*0.02)); ctx.scale(1-st*0.5, 1+st);   // squash & stretch juice
    drawCharacter(ctx, CHARACTERS[selChar], sz);
    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){ const a=Math.max(0,1-p.life/p.max);
      if(p.kind==='bubble'){
        ctx.globalAlpha=a*0.95;
        ctx.fillStyle='rgba(255,255,255,0.28)'; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.2832); ctx.fill();
        ctx.strokeStyle=p.color; ctx.lineWidth=Math.max(1.5,p.size*0.32); ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.beginPath(); ctx.arc(p.x-p.size*0.32,p.y-p.size*0.32,Math.max(1.5,p.size*0.3),0,6.2832); ctx.fill();
      } else {
        ctx.globalAlpha=a; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.2832); ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }
  function drawPops(){
    ctx.textAlign='center'; ctx.font=`800 ${Math.round(H*0.028)}px Poppins, sans-serif`;
    for(const p of pops){ const a=1-p.life/p.max; ctx.globalAlpha=Math.max(0,a); ctx.fillStyle='#fff'; ctx.fillText(p.text,p.x,p.y); }
    ctx.globalAlpha=1;
  }
  function drawDowndraft(){
    if(downdraft<=0) return;
    ctx.save();
    ctx.strokeStyle='rgba(150,200,255,0.45)'; ctx.lineWidth=2;
    const off=(distance*60)%50;
    for(let i=0;i<16;i++){ const x=(i*W/16)+(i%2?12:0); const y=((off+i*70)%(H+70))-35;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+34); ctx.stroke(); }
    ctx.fillStyle='#bfe0ff'; ctx.textAlign='center'; ctx.font=`800 ${Math.round(H*0.022)}px Poppins,sans-serif`;
    ctx.shadowColor='rgba(120,180,255,.9)'; ctx.shadowBlur=12;
    ctx.fillText('⬇ DOWNDRAFT', W/2, H*0.16);
    ctx.restore();
  }
  function drawVignette(){ ctx.fillStyle=G_vig; ctx.fillRect(0,0,W,H); }
  function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  // ----- Loop -----
  let last=0;
  function frame(t){ const now=t/1000; let dt=last?now-last:0; last=now; if(dt>1/30) dt=1/30; update(dt); draw(); requestAnimationFrame(frame); }
  resize(); reset();
  account=loadAccount(); refreshMenu();
  const _p=new URLSearchParams(location.search);
  if(_p.has('bot')) DEBUG_BOT=true;
  if(_p.has('bg')) BG=parseInt(_p.get('bg'))||0;   // dev: background style 0-3
  if(_p.has('start')) START_H=parseInt(_p.get('start'))||0;   // dev: warp-start at this height (e.g. ?start=800)
  if(_p.has('char')) selChar=Math.max(0,Math.min(CHARACTERS.length-1,parseInt(_p.get('char'))||0));  // dev
  if(_p.has('force')){ FORCE=_p.get('force');
    clouds.push({z:13, wy:1.3, baseWy:1.3, drift:false, dphase:0, damp:0, used:false, missed:false, puff:0, type:FORCE}); }
  if(_p.has('dd')) downdraft=4;
  if(_p.has('auto')){ startGame(); if(_p.has('h')) maxRy=(parseInt(_p.get('h'))||0)/10; }  // dev autoplay
  else if(_p.has('over')){ startGame(); maxRy=12.3; state=ST.DEAD; finishToGameOver(); }   // dev preview death
  else if(_p.has('shopdev')){ buildDresser(); show('shop'); }                              // dev preview shop
  else { account ? goMenu() : show('login'); }                                             // normal: login or menu
  requestAnimationFrame(frame);
})();
</script>
